name: cisco-kafka

services:
  frontend:
    build: ./frontend
    container_name: cisco-frontend
    ports:
      - "7000:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: cisco-backend
    ports:
      - "7001:5000"
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      COMMAND_TOPIC: cisco-commands
      RESULT_TOPIC: cisco-results
      ROUTERS_FILE: /config/routers.json
    volumes:
      - ./config:/config:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: ./worker
    # Host networking: the worker sees the VM's real interfaces, so router
    # discovery can scan the VM's subnets, and reaches the routers exactly
    # like the VM itself does. Kafka is then reached on its host port.
    network_mode: host
    environment:
      KAFKA_BOOTSTRAP: localhost:7092
      COMMAND_TOPIC: cisco-commands
      RESULT_TOPIC: cisco-results
      ROUTERS_FILE: /config/routers.json
    volumes:
      - ./config:/config:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    container_name: cisco-kafka
    ports:
      - "7092:7092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'CONTROLLER://kafka:29093,PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:7092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:7092'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 12
    restart: unless-stopped

  # One-shot: creates the topics with enough partitions for several workers.
  kafka-init:
    image: apache/kafka:3.9.1
    container_name: cisco-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for topic in cisco-commands cisco-results; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
            --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cisco-kafka-ui
    ports:
      - "7080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: 'cisco-cluster'
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka:29092'
    restart: unless-stopped

volumes:
  kafka-data:
